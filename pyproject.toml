[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-odyssey"
version = "0.1.0"
description = "Vector Odyssey research and trading system"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
files = ["python/vo"]
strict = true
