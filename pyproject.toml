[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-odyssey"
version = "0.1.0"
description = "Vector Odyssey research and trading system"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6",
    # Windows ships no system IANA timezone database, so zoneinfo
    # (used by vo.time.brokers for America/New_York) needs this package
    # there. Linux/Mac have the system copy, which is why tests never
    # caught it -- but VO_EA runs on the user's Windows terminal.
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
# Only needed to run the dashboard backend (dashboard/backend/app.py) --
# kept out of core so the EA/VO side never gains a web-framework
# dependency it doesn't need (audit R10: keep Python 3.13-pin risk low by
# only pulling in what a given piece actually requires).
dashboard = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

# Only needed on the Windows machine running the MT5 terminal, for the
# Phase 12 read adapter (vo.market.mt5) -- the sole MetaTrader5 importer.
# Kept optional and Windows-marked so the core/test environment (Linux CI)
# never needs the package or a terminal; the mappers are tested with
# fabricated inputs, and vo.market.mt5 imports the package lazily.
mt5 = [
    "MetaTrader5>=5.0; platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["python", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
files = ["python/vo"]
strict = true

# MetaTrader5 is an optional, Windows-only, untyped dependency; the one
# module that imports it (vo.market.mt5) does so lazily. mypy runs in the
# core/CI env where it is not installed and ships no stubs.
[[tool.mypy.overrides]]
module = "MetaTrader5"
ignore_missing_imports = true
