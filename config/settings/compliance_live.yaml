# config/settings/compliance_live.yaml      versioned
#
# THE LIVE PERSONAL ACCOUNT's compliance profile, as distinct from
# compliance.yaml, which carries the prop-firm-shaped defaults taken from
# the PropFirmGuard reference. Both are loaded by the same
# load_compliance_config(path); which file a process reads is a wiring
# choice, not a code change.
#
# These numbers come from the user directly (2026-09-19), not from a
# reference implementation:
#
#   "for live account only have daily risk breach when drawdown is
#    reaching close to breach and max draw down 20% and its only allowed
#    to be in one trade at a time"
#
# Three things follow from that, and each is recorded where it belongs:
#
#   1. Max drawdown 20%              -> total_drawdown_limit_fraction below.
#   2. No independent daily figure   -> daily_loss_mode: DRAWDOWN_HEADROOM.
#      There is no prop firm imposing a daily rule on this account, so the
#      day halts when the TOTAL drawdown gets close to breaching, not at
#      an arbitrary daily loss. See DailyLossMode's own docstring.
#   3. One trade at a time           -> risk.yaml's max_open_positions: 1,
#      which is ALREADY set there and needs no change. Position count is
#      the risk manager's concern, not this file's -- compliance bounds
#      the account, risk bounds the trade.
version: 1

# Informational in DRAWDOWN_HEADROOM mode -- still computed and reported
# on every verdict (daily_loss_used_fraction), but it does not gate.
# Kept at a realistic figure so the telemetry stays meaningful.
daily_loss_limit_fraction: 0.05

# The real constraint on this account: 20%.
total_drawdown_limit_fraction: 0.20

# Subtracted from the limit before it is enforced, so the engine
# intervenes before 20% is actually touched. Enforced limit = 19.5%.
safety_buffer_fraction: 0.005

# Staging only; never blocks on its own.
warning_threshold_fraction: 0.70
critical_threshold_fraction: 0.90

# DRAWDOWN_HEADROOM: the day is over once total drawdown has consumed
# this share of its buffer-adjusted allowance.
daily_loss_mode: DRAWDOWN_HEADROOM

# CONFIRMED BY THE USER (2026-09-19): 0.65, lowered from an initial 0.75.
# Their reasoning, worth keeping: headroom left below the halt point is
# only real headroom if it is larger than the risk a trade actually
# needs -- a sliver too thin to open a position in is not usable room,
# it just looks like room. Halting earlier keeps what remains spendable.
#
# 0.65 of a 19.5% enforced allowance halts the day at ~12.7% drawdown,
# leaving ~6.8% genuinely usable.
daily_halt_at_total_usage: 0.65

# ── high-water mark (risk anchor, NOT a recovery target) ──────────────────
#
# The account's real peak equity. With this set, the drawdown reference is
# anchored here on the first snapshot instead of to whatever equity the
# process happens to start on -- so an EA started mid-drawdown does not
# treat the bottom of that drawdown as its peak and hand itself a fresh
# full allowance measured from a depressed reference.
#
# THIS MAKES THE LIMITS STRICTER, NEVER LOOSER. It is the opposite of a
# recovery target. The gap back to this number is reported by
# vo.telemetry.benchmark, and gate G16 makes it mechanically impossible
# for any strategy, allocator, risk or compliance code to import that
# reporting -- reporting is not targeting.
#
# THE NUMBER BELOW IS THE USER'S WORDS TAKEN LITERALLY ("the total $27k is
# the peak figure") AND NEEDS ONE CONFIRMATION, because two readings of
# the original message are possible and they behave very differently:
#
#   (a) peak equity WAS $27,000 -- what is written here.
#   (b) the account is $27,000 BELOW its peak, i.e. the peak is
#       current_equity + 27,000, a number that cannot be computed here.
#
# How to tell which you have, without guessing: start the engine and read
# the first verdict. Under (a), if current equity is more than ~19.5%
# below 27,000 (i.e. below ~21,735), the engine will report BREACHED_TOTAL
# immediately and refuse to trade. That is the anchor being honest, not a
# bug -- but if it happens and reading (b) was meant, replace this number
# with the real peak rather than widening total_drawdown_limit_fraction to
# make room. Widening the limit to fit a bookkeeping choice converts it
# into real extra risk.
high_water_mark_currency: 27000.0
