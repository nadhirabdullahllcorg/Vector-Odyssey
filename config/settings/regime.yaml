# config/settings/regime.yaml        versioned; research starting points
#
# Phase 13 (Basic Regime Engine, gate G6). The regime STATE is decided by
# market structure (confirmed swings of `tier`); Efficiency Ratio and Hurst
# are recorded evidence only, never the classifier (per the plan's §5.4-5.6
# split -- Markov/HMM/Hurst never redefine the four ICT states).
#
# THE VALUES BELOW ARE NOT A FINISHED ANSWER -- like config/settings/
# swings.yaml, they are [VO-D]/[VO-H] starting points, to be validated
# against historical data. Changing one does not re-litigate the algorithm,
# only bumps `version`.
#
# v2 (2026-09-18): CONSOLIDATION/EXPANSION boundaries switched from
# wick-based swing prices to candle-BODY prices (SwingPoint.body_price),
# confirmed via G6 human review -- Lesson 1: the consolidation range is
# "defined specifically by the bodies of the candles not the wicks."
# This is a real classifier behavior change (RegimeEngine._is_higher_high
# / _is_lower_low and the _extreme_price/_defining_price boundary
# tracking), not a config-value tweak -- the frozen 1,000,000-bar
# baseline and its v33-v36 validation reports were built under v1's
# wick-based boundaries and need re-running under v2 before being
# trusted again. build_regime_engine() (regime_config.py) now defaults
# methodology_version from this field -- previously it silently ignored
# it and always stamped a bare 1, a latent gap fixed the same day.
version: 4

# v3 (2026-09-18): efficiency_ratio_period bumped 10 -> 14 bars. Confirmed the
# same day via a user-supplied quant-trading reference (Kaufman ER/ATR/Hurst/
# HMM "dual system" framework, folded into vo-trade-logic-and-brain-plan.md
# Sec 5.7's 2026-09-18 revision -- Markov/Hurst/ATR/ER move from
# secondary/entry-timing-only to co-equal Phase 32 stack components, still
# back-tested before trusted per G2). 14 bars is the standard Wilder lookback
# the reference cites for ER/ATR on an execution timeframe (M1/M5) -- a
# config-value bump only, not a classifier behavior change, so no
# re-validation of the frozen 1,000,000-bar CONSOLIDATION/EXPANSION baseline
# is required the way v2's body-boundary change required one. hurst_period
# stays at 20 this round -- the reference's 100-200 bar direction is recorded
# in the plan doc but NOT applied here, since it would invalidate the same
# frozen baseline and needs its own explicit go-ahead first.

# Which swing tier is the structural backbone: SWING (larger) or INTERNAL.
tier: SWING

efficiency_ratio_period: 14   # bars; Kaufman ER window (vo.observation.efficiency_ratio) -- v3
# v4 (2026-09-19): hurst_period 20 -> 128, SELECTED FROM MEASUREMENT, not
# guessed. vo.research.hurst_validation ran the real estimator against
# synthetic fractional Brownian motion of known H (vo.research.fbm,
# Hosking's exact method), 120 trials per cell:
#
#   window | H=0.3 | H=0.5 | H=0.7 | sd@0.5 | separation(0.3 vs 0.7)
#       64 | 0.246 | 0.436 | 0.581 |  0.187 | 1.87 pooled SD
#      128 | 0.255 | 0.428 | 0.627 |  0.149 | 2.69
#      256 | 0.261 | 0.439 | 0.627 |  0.155 | 2.61
#      512 | 0.258 | 0.441 | 0.621 |  0.153 | 2.73
#
# Separation and spread both plateau at 128 -- 256 and 512 cost four and
# sixteen times the warmup for no measurable gain. At the old 20 bars the
# spread at H=0.5 was ~0.30, meaning a single reading of 0.45 carried a
# +/-0.3 uncertainty and could honestly have been 0.15 or 0.75. That is
# the quantitative form of "20 bars is noise".
#
# Ordering is monotonic at every window tested, so no previously reported
# Hurst conclusion was INVERTED -- they were just far noisier than their
# precision implied.
#
# AT M1 THIS IS A SEMANTIC CHANGE, not only a precision one: 128 bars is
# ~2h08 of market time, so Hurst now reads at session scale rather than
# locally. Expect it to move more slowly and to stop tracking short
# swings. That is the intended behaviour of a Hurst estimate; the old
# window was measuring something closer to noise than to memory.
#
# Every Hurst-conditioned report section (validation terciles, the Markov
# conditioning, HMM features, phase agreement) was computed at 20 bars and
# needs regenerating before it can be read again.
hurst_period: 128             # bars; structure-function Hurst window (vo.observation.hurst) -- v4

# [VO-H] anticipation lean thresholds (only affect the recorded lean on a
# PULLBACK_UNRESOLVED state, never the state itself). Fibonacci-flavoured
# depths are a nod, explicitly not asserted correct.
anticipation:
  er_trend_threshold: 0.5     # ER at/above this + shallow pullback -> lean RETRACEMENT
  er_chop_threshold: 0.3      # ER at/below this (or deep pullback) -> lean REVERSAL
  shallow_pullback_ratio: 0.382
  deep_pullback_ratio: 0.786
