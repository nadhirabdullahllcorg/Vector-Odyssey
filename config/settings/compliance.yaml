# config/settings/compliance.yaml        versioned; research starting points
#
# The Account Compliance Engine (vo.compliance, new -- see that package's
# own module docstring and architecture/vo-phase-plan.md). Enforces the
# ACCOUNT's own survival rules -- daily loss limit, total drawdown limit --
# as a veto gate between vo.risk's TradeSignal and vo.execution. Distinct
# from risk.yaml, which sizes ONE trade; this file bounds the WHOLE account.
#
# THE VALUES BELOW ARE NOT THIS ACCOUNT'S REAL PROP-FIRM RULES. They are
# the open-source PropFirmGuard MQL5 reference's own defaults
# (InpDailyLossPct=5.0, InpTotalDdPct=10.0, InpBufferPct=0.5 --
# mql5.com/en/code/76767, fetched and verified directly 2026-09-19), used
# here as a plausible, verified starting point -- like swings.yaml/
# regime.yaml/risk.yaml before it, changing one of these does not
# re-litigate the engine's algorithm, only bumps `version`.
#
# CONFIRM BEFORE A REAL EVALUATION ACCOUNT: the actual prop firm's daily-
# loss and max-drawdown percentages; whether its drawdown is STATIC
# (against a fixed since-activation peak, what this v1 engine implements)
# or TRAILING (a moving reference, e.g. capped at the initial balance --
# a real, firm-specific variant NOT implemented here, see engine.py's own
# module docstring); minimum trading days; any consistency rule; and
# whether the firm resets daily limits at a specific server/UTC hour
# rather than this project's own CME trade-date convention
# (vo.time.calendars.trading_day_of, reused here rather than adding a
# second, cruder "reset hour" concept).
version: 1

# Daily loss limit, as a fraction of the trading day's START equity
# (vo.time.calendars.trading_day_of's own CME trade-date boundary, not a
# calendar-midnight or fixed-server-hour reset). 0.05 = 5%.
daily_loss_limit_fraction: 0.05

# Total drawdown limit, as a fraction of the PEAK equity reached since
# this engine was constructed (a static reference -- see the module
# docstring's TRAILING-drawdown caveat). 0.10 = 10%.
total_drawdown_limit_fraction: 0.10

# Subtracted from BOTH limits above before either is enforced, so the
# engine intervenes before the real prop-firm threshold is ever reached
# (PropFirmGuard's own stated design goal) -- protects against slippage
# carrying a theoretically-fine trade past the firm's actual boundary.
# 0.005 = 0.5%.
safety_buffer_fraction: 0.005

# Informational staging only (never blocks a trade on its own): once
# either limit's usage -- daily loss or total drawdown, as a fraction of
# its OWN buffer-adjusted limit -- crosses these thresholds, the verdict
# reports WARNING/CRITICAL instead of SAFE. Matches the MQL5 Compliance
# Monitor reference's own 70%/90% defaults (mql5.com/en/articles/24396).
warning_threshold_fraction: 0.70
critical_threshold_fraction: 0.90
